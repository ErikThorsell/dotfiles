- name: Configure workstation (macOS or Ubuntu)
  hosts: workstation
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_become_exe: sudo
  pre_tasks:
    - name: Only macOS and Debian-family hosts are supported
      assert:
        that: ansible_facts['os_family'] in ['Darwin', 'Debian']
        fail_msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}"

    - name: Fail early if mise is not on PATH
      command: mise --version
      changed_when: false

    - name: Detect sudo
      stat:
        path: /usr/bin/sudo
      register: sudo_bin

    - name: Detect dzdo
      stat:
        path: /usr/bin/dzdo
      register: dzdo_bin

    - name: If dzdo is present and sudo is not, use dzdo
      set_fact:
        ansible_become_exe: dzdo
      when: not sudo_bin.stat.exists and dzdo_bin.stat.exists

  roles:
    # Basic tools and config
    - role: bash
    - role: pkgs
      tags: [pkgs]
    - role: bat
    - role: delta
    - role: eza
    - role: fd
    - role: git
    - role: ghostty
      tags: [ghostty]
    # Managed via mise
    - role: gitui
    - role: kubectl
    - role: kustomize
    - role: neovim
    - role: nodejs
    - role: opentofu
    - role: ripgrep
    - role: rust
    - role: talosctl
    - role: tree-sitter
    - role: yq
    # Upgrade everything installed by apt/brew
    - role: upgrade
      tags: [upgrade]
