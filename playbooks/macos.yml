- name: Configure macOS workstation
  hosts: macos
  gather_facts: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3

  roles:
    # Basic tools and config
    - role: bash
    - role: pkgs
      tags: [pkgs]
    - role: bat
    - role: delta
    - role: eza
    - role: fd
    - role: git
    - role: ghostty
      tags: [ghostty]
    # Managed via mise | If you don't have mise, these will fail.
    - role: gitui
    - role: kubectl
    - role: kustomize
    - role: neovim
    - role: nodejs
    - role: opentofu
    - role: ripgrep
    - role: rust
    - role: talosctl
    - role: tree-sitter
    - role: yq
    # Upgrade everything installed by apt/brew
    - role: upgrade
      tags: [upgrade]
