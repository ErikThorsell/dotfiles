---
# Earlier versions installed Neovim from Homebrew on macOS; it would compete with mise's on PATH.
- name: Remove Homebrew Neovim
  homebrew:
    name: neovim
    state: absent
  when: ansible_facts['os_family'] == "Darwin"

- name: Install/activate neovim via mise (global)
  command: "mise use -g neovim"
  register: mise_result
  changed_when: "'installed' in (mise_result.stdout | lower) or 'installed' in (mise_result.stderr | lower)"

# Nix LSP: Neovim enables nil when it is on PATH. Mason can only build nil from source (it needed Rust for that),
# so on machines with Nix take nil and its formatter, nixfmt, prebuilt from nixpkgs instead.
- name: Check whether Nix is installed
  shell: command -v nix
  register: neovim_nix
  changed_when: false
  failed_when: false
  check_mode: false

- name: List the Nix profile
  command: nix --extra-experimental-features 'nix-command flakes' profile list --json
  register: neovim_nix_profile
  changed_when: false
  check_mode: false
  when: neovim_nix.rc == 0

- name: Install nil and nixfmt into the Nix profile
  command: >-
    nix --extra-experimental-features 'nix-command flakes' profile install
    {{ neovim_nix_missing | map('regex_replace', '^', 'nixpkgs#') | join(' ') }}
  vars:
    neovim_nix_missing: "{{ ['nil', 'nixfmt'] | difference((neovim_nix_profile.stdout | from_json).elements | default({}) | list) }}"
  when:
    - neovim_nix.rc == 0
    - neovim_nix_missing | length > 0

# Earlier versions let Mason install nil and nixfmt, on every machine; they come from Nix now, or not at all.
- name: Remove Mason's nil and nixfmt
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/nvim/mason/{{ item }}"
    state: absent
  loop:
    - packages/nil
    - bin/nil
    - packages/nixfmt
    - bin/nixfmt

- name: Ensure config directory for neovim exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
    state: directory
    mode: '0755'

- name: Symlink init.lua
  file:
    src:  "{{ role_path }}/files/init.lua"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/init.lua"
    state: link
    force: yes

- name: Symlink lua configuration files
  file:
    src:  "{{ role_path }}/files/lua"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua"
    state: link
    force: yes
