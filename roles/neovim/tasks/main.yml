---
# Earlier versions installed Neovim from Homebrew on macOS; it would compete with mise's on PATH.
- name: Remove Homebrew Neovim
  homebrew:
    name: neovim
    state: absent
  when: ansible_facts['os_family'] == "Darwin"

- include_tasks: apt.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install/activate neovim via mise (global)
  command: "mise use -g neovim"
  register: mise_result
  changed_when: "'installed' in (mise_result.stdout | lower) or 'installed' in (mise_result.stderr | lower)"

# Nix LSP: Mason can only build nil from source (it needed Rust for that), so take nil and its formatter, nixfmt,
# prebuilt from nixpkgs. Nix itself comes from the nix role; it is called by full path because a fresh install isn't
# on Ansible's PATH yet.
- name: Check that Nix is installed (in --check runs the nix role can't have installed it yet)
  stat:
    path: /nix/var/nix/profiles/default/bin/nix
  register: neovim_nix_bin

- name: List the Nix profile
  command: /nix/var/nix/profiles/default/bin/nix profile list --json
  register: neovim_nix_profile
  changed_when: false
  check_mode: false
  when: neovim_nix_bin.stat.exists

- name: Install nil and nixfmt into the Nix profile
  command: >-
    /nix/var/nix/profiles/default/bin/nix profile install
    {{ neovim_nix_missing | map('regex_replace', '^', 'nixpkgs#') | join(' ') }}
  vars:
    neovim_nix_missing: "{{ ['nil', 'nixfmt'] | difference((neovim_nix_profile.stdout | from_json).elements | default({}) | list) }}"
  when:
    - neovim_nix_bin.stat.exists
    - neovim_nix_missing | length > 0

# Earlier versions let Mason install nil and nixfmt; they come from Nix now.
- name: Remove Mason's nil and nixfmt
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/nvim/mason/{{ item }}"
    state: absent
  loop:
    - packages/nil
    - bin/nil
    - packages/nixfmt
    - bin/nixfmt

- name: Ensure config directory for neovim exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
    state: directory
    mode: '0755'

- name: Symlink init.lua
  file:
    src:  "{{ role_path }}/files/init.lua"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/init.lua"
    state: link
    force: yes

- name: Symlink lua configuration files
  file:
    src:  "{{ role_path }}/files/lua"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lua"
    state: link
    force: yes

# lazy.nvim rewrites the lockfile in place (following the symlink), so `:Lazy update` shows up as a diff in this repo
# and every machine runs the same plugin versions (`:Lazy restore` applies it). Replaces each machine's local copy.
- name: Symlink lazy.nvim's lockfile
  file:
    src:  "{{ role_path }}/files/lazy-lock.json"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/lazy-lock.json"
    state: link
    force: yes

# Earlier versions symlinked ~/.config/nvim/after to roles/neovim/files/after, which no longer exists.
- name: Inspect ~/.config/nvim/after
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/after"
  register: neovim_after

- name: Remove the old ~/.config/nvim/after symlink
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/after"
    state: absent
  when:
    - neovim_after.stat.islnk | default(false)
    - neovim_after.stat.lnk_target | default('') is search('roles/neovim/files/after$')
