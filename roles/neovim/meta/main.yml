---
# Tools Neovim and its plugins expect on PATH. Ansible runs these roles before neovim (and only once, even when the
# playbook lists them too).
dependencies:
  - role: git          # lazy.nvim clones and updates plugins with git
  - role: nodejs       # Mason installs pyright and ansiblels with npm
  - role: ripgrep      # Telescope: live_grep, and find_files prefers `rg --files`
  - role: tree-sitter  # nvim-treesitter (main branch) builds parsers with the tree-sitter CLI
