---
- name: Remove eza
  become: yes
  apt:
    name: eza
    state: absent
    purge: yes

# Earlier versions installed eza from the gierens third-party repo.
- name: Remove the gierens apt repo and its keyrings
  become: yes
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/gierens.list
    - /etc/apt/keyrings/gierens.gpg
    - /etc/apt/keyrings/gierens.gpg~
    - /etc/apt/keyrings/gierens-archive-keyring.gpg
  register: eza_gierens_removed

- name: Refresh apt cache after removing the gierens repo
  become: yes
  apt:
    update_cache: yes
  when: eza_gierens_removed is changed
